name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Syntax-check the Electron and browser scripts
        run: node --check main.js preload.js panel/panel.js viewer/compare.js viewer/compare-preload.js scripts/icon-svg.js scripts/icon-raster.js
      - run: npm test
